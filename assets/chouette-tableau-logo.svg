  <path d="M72 48 Q84 40 96 50" fill="none" stroke="#3ddc97" stroke-width="3.5" stroke-linecap="round"/>
  <!-- grands yeux ronds avec un reflet -->
  <circle cx="47" cy="64" r="12" fill="none" stroke="#3ddc97" stroke-width="3.5"/>
  <circle cx="83" cy="64" r="12" fill="none" stroke="#3ddc97" stroke-width="3.5"/>
  <circle cx="47" cy="65" r="6" fill="#3ddc97"/>
  <circle cx="83" cy="65" r="6" fill="#3ddc97"/>
  <circle cx="49.5" cy="62.5" r="2" fill="#10131a"/>
  <circle cx="85.5" cy="62.5" r="2" fill="#10131a"/>
  <!-- petit bec souriant -->
  <path d="M59 77 Q65 74 71 77 L65 85 Z" fill="#ffc531" stroke="#ffc531" stroke-width="2" stroke-linejoin="round"/>
  <!-- éclair sur le ventre -->
  <path d="M68 90 L58 101 L64 101 L61 108 L72 97 L66 97 Z" fill="#ffc531"/>
