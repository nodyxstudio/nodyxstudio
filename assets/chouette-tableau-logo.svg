<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" role="img" aria-label="Chouette Tableau">
  <rect width="130" height="130" rx="28" fill="#10131a"/>
  <!-- corps tout rond de la chouette, avec deux petites oreilles douces -->
  <path d="M30 40 Q30 24 44 28 Q65 18 86 28 Q100 24 100 40 Q110 58 108 80 Q104 112 65 112 Q26 112 22 80 Q20 58 30 40 Z" fill="none" stroke="#3ddc97" stroke-width="3.5" stroke-linejoin="round"/>
